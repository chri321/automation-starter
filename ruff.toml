# ruff.toml - Python linting for automation scripts
#
# Adapted from snowdreamtech/template (ruff.toml).
# Ruff replaces flake8 + isort + pyupgrade + pycodestyle in a single fast binary.

line-length = 120

extend-exclude = [
  ".git",
  ".venv",
  "venv",
  "env",
  "node_modules",
  "vendor",
  "dist",
  "build",
  "out",
  "__pycache__",
]

[lint]
# E  pycodestyle errors
# F  pyflakes (undefined names, unused imports - the genuinely useful ones)
# W  pycodestyle warnings
# I  isort (import ordering)
# N  pep8-naming
select = ["E", "F", "W", "I", "N"]
ignore = []
